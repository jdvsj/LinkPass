<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中</title>
    <link rel="stylesheet" href="../assets/css/api.css">
</head>
<body>
    <div class="container">
        <div class="loading"></div>
        <p class="tip">正在安全跳转，请稍候...</p>
        <p id="targetUrl" class="url"></p>
    </div>

    <script>
        // 新增解密函数（与加密步骤对应）
        function decryptUrl(encoded) {
            try {
                // 步骤1: Base64解密
                const base64Decoded = atob(encoded);
                // 步骤2: URI解码
                return decodeURIComponent(base64Decoded);
            } catch (e) {
                console.error('解密失败:', e);
                return 'https://github.com/Taocrypt/LinkPass'; // 解密失败时的默认链接
            }
        }

        // 替换原有的getUrl函数（核心修改）
        function getUrl() {
            const params = new URLSearchParams(window.location.search);
            // 优先使用加密后的code参数，兼容原有的url参数
            const encryptedCode = params.get('code');
            if (encryptedCode) {
                return decryptUrl(encryptedCode);
            } else {
                // 保留原有的兼容逻辑（支持旧链接）
                const urlParam = params.get('url');
                return urlParam || 'https://github.com/Taocrypt/LinkPass';
            }
        }

        // 保留原有的环境检测和跳转逻辑
        function redirect() {
            const targetUrl = getUrl();
            document.getElementById('targetUrl').textContent = `目标: ${targetUrl}`;
            
            const userAgent = navigator.userAgent.toLowerCase();
            // QQ/微信环境内使用iframe
            if (userAgent.includes('qq') || userAgent.includes('micromessenger')) {
                setTimeout(() => {
                    document.body.innerHTML = `<iframe src="${targetUrl}" frameborder="0" width="100%" height="100%"></iframe>`;
                }, 2000);
            } else {
                // 其他环境直接跳转
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 2000);
            }
        }

        // 页面加载后执行跳转
        window.onload = redirect;
    </script>
</body>
</html>
